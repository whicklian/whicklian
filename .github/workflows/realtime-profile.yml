name: Real-Time Profile Telemetry Updater

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch live GitHub telemetry & update README + HUD SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_realtime_profile.py

      - name: Commit and push real-time updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/realtime-hud.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore(telemetry): sync real-time GitHub stats, streaks, and activity [skip ci]"
            git push
          else
            echo "No telemetry changes to commit."
          fi
